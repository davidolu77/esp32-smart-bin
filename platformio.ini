[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.9
    pololu/VL53L0X@^1.3.1

[env:esp32dev]
upload_protocol = esptool

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = esp32-smart-bin.local
# Fixed PC-side callback port makes a narrow Windows Firewall rule possible.
upload_flags =
    --host_port=32323

